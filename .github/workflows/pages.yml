name: Deploy Hexo Blog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. 安装依赖与渲染器
        run: |
          # 关键：必须先安装 Stylus 渲染器
          npm install hexo-renderer-stylus --save
          # 安装博客本体的依赖
          npm install

      - name: 4. 拉取 Solitude 主题源码
        run: |
          # 直接用 Git 克隆主题，保证样式源文件完整
          git clone https://github.com/everfu/hexo-theme-solitude.git themes/solitude

      - name: 5. 生成静态文件
        run: npx hexo clean && npx hexo generate

      - name: 6. 上传 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 7. 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
